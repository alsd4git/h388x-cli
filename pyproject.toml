[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "h388x-cli"
version = "0.1.0"
description = "A CLI tool to manage the ZTE H388X (TIM HUB+) modem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "requests>=2.32.4",
]

[project.scripts]
h388x = "h388x_cli.cli:app"
