name: Apply issue 2 source patch

on:
  push:
    branches: [improve/h388x-hardening-release]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: improve/h388x-hardening-release
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          version: latest-known
          enable-cache: true
      - name: Apply source changes
        run: |
          python .github/scripts/apply_issue2.py
          python .github/scripts/fix_issue2_indent.py
      - name: Validate issue #2 behavior
        run: |
          uv sync --locked --dev
          uv run ruff check h388x_cli tests
          uv run pytest
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h388x_cli/api.py h388x_cli/cli.py
          git diff --cached --check
          git commit -m "fix: validate writes and surface partial bulk failures (#2)"
          git push origin HEAD:improve/h388x-hardening-release
