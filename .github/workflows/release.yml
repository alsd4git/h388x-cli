name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release commit belongs to main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          version: latest-known
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync --locked --dev

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Run release quality gate
        run: |
          uv run ruff check h388x_cli tests
          uv run ruff format --check h388x_cli tests
          uv run pytest

      - name: Build package
        run: uv build

      - name: Verify wheel install and metadata
        shell: bash
        run: |
          uv venv --python 3.14 .venv-release-smoke
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python .venv-release-smoke/bin/python "$wheel"
          .venv-release-smoke/bin/h388x --help
          wheel_version="$(.venv-release-smoke/bin/python -c 'from importlib.metadata import version; print(version("h388x-cli"))')"
          test "$GITHUB_REF_NAME" = "v$wheel_version"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh
