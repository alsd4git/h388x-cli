name: Apply issue 1 error semantics

on:
  push:
    branches: [improve/h388x-hardening-release]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: improve/h388x-hardening-release
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          version: latest-known
          enable-cache: true
      - name: Apply issue #1 source and tests
        run: python .github/scripts/apply_issue1.py
      - name: Validate issue #1 behavior
        run: |
          uv sync --locked --dev
          uv run ruff check h388x_cli tests
          uv run pytest
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h388x_cli/api.py h388x_cli/cli.py pyproject.toml tests/test_api_flow.py tests/test_error_semantics.py
          git diff --cached --check
          git commit -m "fix: make HTTP and parse failures explicit (#1)"
          git push origin HEAD:improve/h388x-hardening-release
