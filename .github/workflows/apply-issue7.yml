name: Apply issue 7 polish

on:
  push:
    branches: [improve/h388x-hardening-release]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: improve/h388x-hardening-release
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          version: latest-known
          enable-cache: true
      - name: Apply polish
        run: python .github/scripts/apply_issue7.py
      - name: Normalize new test formatting
        run: |
          uv sync --locked --dev
          uv run ruff format tests/test_coverage.py
      - name: Validate
        run: |
          uv run ruff check h388x_cli tests
          uv run ruff format --check h388x_cli tests
          uv run pytest
          uv run --with coverage coverage run -m pytest
          uv run --with coverage coverage report
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h388x_cli/coverage.py tests/test_coverage.py tests/test_cli_smoke.py README.md .gitignore
          git diff --cached --check
          git commit -m "fix: make capability detection explicit (#7)"
          git push origin HEAD:improve/h388x-hardening-release
