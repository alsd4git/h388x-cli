name: Apply second review feedback

on:
  push:
    branches: [improve/h388x-hardening-release]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: improve/h388x-hardening-release
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          version: latest-known
          enable-cache: true

      - name: Apply fixes
        run: python .github/scripts/apply_review_feedback_round2.py

      - name: Format touched Python files
        run: |
          uv sync --locked --dev
          uv run ruff format \
            h388x_cli/discovery.py \
            h388x_cli/devices.py \
            tests/test_discovery.py \
            tests/test_devices_cli.py

      - name: Validate
        run: |
          uv run ruff check h388x_cli tests
          uv run ruff format --check h388x_cli tests
          uv run pytest
          uv run --with coverage coverage run -m pytest
          uv run --with coverage coverage report
          uv build

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            h388x_cli/discovery.py \
            h388x_cli/devices.py \
            tests/test_discovery.py \
            tests/test_devices_cli.py
          git diff --cached --check
          git commit -m "fix: address second PR review findings"
          git push origin HEAD:improve/h388x-hardening-release
