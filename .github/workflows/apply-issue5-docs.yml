name: Apply issue 5 install docs

on:
  push:
    branches: [improve/h388x-hardening-release]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: improve/h388x-hardening-release
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          version: latest-known
          enable-cache: true
      - name: Apply README installation update
        run: python .github/scripts/apply_issue5_docs.py
      - name: Validate project after documentation update
        run: |
          uv sync --locked --dev
          uv run ruff check h388x_cli tests
          uv run pytest
          uv build
      - name: Commit validated README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --check
          git commit -m "docs: document tag-pinned uv installation (#5)"
          git push origin HEAD:improve/h388x-hardening-release
