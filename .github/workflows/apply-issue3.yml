name: Apply issue 3 resilience

on:
  push:
    branches: [improve/h388x-hardening-release]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: improve/h388x-hardening-release
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          version: latest-known
          enable-cache: true
      - name: Apply issue #3 source and tests
        run: python .github/scripts/apply_issue3.py
      - name: Validate issue #3 behavior and safety
        run: |
          uv sync --locked --dev
          uv run ruff check h388x_cli tests
          uv run pytest
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h388x_cli/discovery.py h388x_cli/cli.py tests/test_discovery.py tests/test_resilience_cli.py
          git diff --cached --check
          git commit -m "fix: harden discovery, watch and cached logout (#3)"
          git push origin HEAD:improve/h388x-hardening-release
